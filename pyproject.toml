[project]
name = "indra"
version = "1.1.0"
description = "Revived version of indra package for modern python versions."
readme = "README.md"
authors = [
    { name = "paragrastogi", email = "rastogi.parag@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "statsmodels>=0.14.2",
]

[project.scripts]
indra = "indra:cli"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
